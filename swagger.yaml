  /commission/current:
    get:
      summary: Fetch the current platform commission rate (Instructor)
      tags:
        - Commission Rate
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current platform commission rate fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Current platform commission rate fetched successfully
                  data:
                    type: object
                    properties:
                      commissionRate:
                        type: number
                        example: 20
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Instructor only)
        '500':
          description: Internal server error

  /commission:
    get:
      summary: Fetch the current platform commission rate and change history (Admin Only)
      tags:
        - Commission Rate
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Commission rate fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Commission rate fetched successfully
                  data:
                    type: object
                    properties:
                      commissionRate:
                        type: number
                        example: 20
                      changeHistory:
                        type: array
                        items:
                          type: object
                          properties:
                            oldRate:
                              type: number
                              example: 15
                            newRate:
                              type: number
                              example: 20
                            updatedBy:
                              type: string
                              example: "60a75b..."
                            updatedAt:
                              type: string
                              format: date-time
                              example: "2026-07-13T14:52:45.000Z"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '500':
          description: Internal server error
    put:
      summary: Update the platform commission rate (Admin only)
      tags:
        - Commission Rate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newRate
              properties:
                newRate:
                  type: number
                  description: New commission rate (between 5 and 50)
                  example: 20
      responses:
        '200':
          description: Commission rate updated and history logged successfully!
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Commission rate updated and history logged successfully!
                  data:
                    type: object
                    properties:
                      currentRate:
                        type: number
                        example: 20
                      changeHistory:
                        type: array
                        items:
                          type: object
                          properties:
                            oldRate:
                              type: number
                              example: 15
                            newRate:
                              type: number
                              example: 20
                            updatedBy:
                              type: string
                              example: "60a75b..."
                            updatedAt:
                              type: string
                              format: date-time
                              example: "2026-07-13T14:52:45.000Z"
        '400':
          description: Validation error (rate not between 5-50% or identical to current rate)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '500':
          description: Internal server error

  /payment/initiate/{courseId}:
    post:
      tags: [Payment]
      summary: Student initiates payment/enrollment for a course
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment session created
        "400":
          description: Already enrolled / invalid request
        "404":
          description: Course or student not found
        "502":
          description: SSLCommerz session creation failed

  /payment/my-payments:
    get:
      tags: [Payment]
      summary: Student — list own payment history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of payments

  /payment/success:
    post:
      tags: [Payment]
      summary: SSLCommerz success callback
      responses:
        "303":
          description: Redirects to frontend success page

  /payment/fail:
    post:
      tags: [Payment]
      summary: SSLCommerz fail callback
      responses:
        "303":
          description: Redirects to frontend fail page

  /payment/cancel:
    post:
      tags: [Payment]
      summary: SSLCommerz cancel callback
      responses:
        "303":
          description: Redirects to frontend cancel page

  /payment/ipn:
    post:
      tags: [Payment]
      summary: SSLCommerz server-to-server IPN listener
      responses:
        "200":
          description: IPN acknowledged

  /payment/refund/{paymentId}:
    post:
      tags: [Payment]
      summary: Student requests a refund
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Refund request submitted
        "400":
          description: Refund window expired / already requested

  /payment/refund-requests:
    get:
      tags: [Payment]
      summary: Admin — list all pending refund requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of refund requests

  /payment/refund/{paymentId}/process:
    put:
      tags: [Payment]
      summary: Admin — approve or reject a refund request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                adminNote: { type: string }
      responses:
        "200":
          description: Refund processed
        "400":
          description: No pending refund request
        "502":
          description: SSLCommerz refund initiation failed

  /payment/instructor/earnings:
    get:
      tags: [Payment]
      summary: Instructor — earnings summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Earnings summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      totalEarned:
                        type: number
                      available:
                        type: number
                      holding:
                        type: number
                        description: Earnings from payments made in the last 7 days (cannot be withdrawn yet)
                      pendingWithdrawal:
                        type: number
                      withdrawn:
                        type: number
                      totalRefunded:
                        type: number
                      payments:
                        type: array
                        items:
                          $ref: '#/components/schemas/Payment'

  /withdrawal:
    post:
      tags: [Withdrawal]
      summary: Instructor requests withdrawal
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accountInfo: { type: string, example: "bKash: 017xxxxxxxx" }
      responses:
        "201":
          description: Withdrawal request created
        "400":
          description: No available balance / pending request already exists
    get:
      tags: [Withdrawal]
      summary: Admin — list withdrawal requests
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: List of withdrawal requests

  /withdrawal/my-requests:
    get:
      tags: [Withdrawal]
      summary: Instructor — list own withdrawal requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of own withdrawal requests

  /withdrawal/{withdrawalId}/process:
    put:
      tags: [Withdrawal]
      summary: Admin — approve or reject a withdrawal request
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: withdrawalId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                adminNote: { type: string }
      responses:
        "200":
          description: Withdrawal processed

