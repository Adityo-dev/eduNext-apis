openapi: 3.0.0
info:
  title: EduNext API Documentation
  version: 1.0.0
  description: API documentation for EduNext E-Learning Marketplace Platform - Developed by Aditto Dev
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
  - url: https://edunext-apis.onrender.com/api/v1
    description: Production Server (Render)

# ── global security ──
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token here (Without 'Bearer ' prefix).

# 🌐 ──────────────── AUTH ROUTES ────────────────
paths:
  /auth/signup:
    post:
      summary: Register a new user (Student/Instructor with Expertise)
      tags:
        - Authentication
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
                - password
                - role
              properties:
                firstName:
                  type: string
                  example: Aditto
                lastName:
                  type: string
                  example: Dev
                email:
                  type: string
                  example: aditto@example.com
                phone:
                  type: string
                  example: "01712345678"
                password:
                  type: string
                  example: "password123"
                role:
                  type: string
                  enum: [student, instructor]
                  example: instructor
                areaOfExpertise:
                  type: array
                  description: Required only if role is 'instructor'
                  items:
                    type: string
                  example: ["Next.js", "TypeScript", "React"]
      responses:
        201:
          description: Registration successful. OTP sent to email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Registration successful. Please verify your email."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "60a75b..."
                      firstName:
                        type: string
                        example: Aditto
                      lastName:
                        type: string
                        example: Dev
                      fullName:
                        type: string
                        example: Aditto Dev
                      email:
                        type: string
                        example: aditto@example.com
                      phone:
                        type: string
                        example: "01712345678"
                      role:
                        type: string
                        example: instructor
                      areaOfExpertise:
                        type: array
                        items:
                          type: string
                        example: ["Next.js", "TypeScript", "React"]
        400:
          description: Validation error or User already exists

  /auth/login:
    post:
      summary: Login user and get token
      tags:
        - Authentication
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: aditto@example.com
                password:
                  type: string
                  example: "password123"
      responses:
        200:
          description: Logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logged in successfully"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "60a75b..."
                      firstName:
                        type: string
                        example: Aditto
                      lastName:
                        type: string
                        example: Dev
                      fullName:
                        type: string
                        example: Aditto Dev
                      email:
                        type: string
                        example: aditto@example.com
                      phone:
                        type: string
                        example: "01712345678"
                      role:
                        type: string
                        example: instructor
                      areaOfExpertise:
                        type: array
                        items:
                          type: string
                        example: ["Next.js", "TypeScript", "React"]
        400:
          description: Please provide email and password
        401:
          description: Invalid email or password / Email not registered
        403:
          description: Forbidden - Account suspended, pending admin approval, or email not verified

  /auth/verify-otp:
    post:
      summary: Verify user email with OTP (Auto-login supported)
      tags:
        - Authentication
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  example: aditto@example.com
                otp:
                  type: string
                  example: "123456"
      responses:
        200:
          description: Email verified successfully. Returns JWT token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Email verified successfully!"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "60a75b..."
                      fullName:
                        type: string
                        example: Aditto Dev
                      email:
                        type: string
                        example: aditto@example.com
                      role:
                        type: string
                        example: instructor
        400:
          description: Invalid or expired OTP / Missing required fields
        404:
          description: User not found

  /auth/resend-otp:
    post:
      summary: Delete old OTPs and send a new one
      tags:
        - Authentication
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: aditto@example.com
      responses:
        200:
          description: New OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "A new OTP has been sent to your email."
        400:
          description: Email is required
        404:
          description: User not found

  # 👑 ──────────────── SUPER ADMIN ROUTES ────────────────
  /admin/user-stats:
    get:
      summary: Get user management stats cards data (Admin Only)
      tags:
        - Super Admin Actions
      responses:
        200:
          description: Stats fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User management stats fetched successfully"
                  data:
                    type: object
                    properties:
                      totalUsers:
                        type: number
                        example: 7
                      totalStudents:
                        type: number
                        example: 4
                      totalInstructors:
                        type: number
                        example: 3
                      totalSuspended:
                        type: number
                        example: 2
        403:
          description: Forbidden - Admin access required

  /admin/users:
    get:
      summary: Get all registered users (Admin Only)
      tags:
        - Super Admin Actions
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [student, instructor, admin]
      responses:
        200:
          description: List of users retrieved successfully

  /admin/users/{id}/status:
    patch:
      summary: Suspend or Activate a user account
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The User ID
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, suspended]
                  example: suspended
      responses:
        200:
          description: User status updated successfully

  /admin/instructors/{id}/verify:
    patch:
      summary: Verify or Reject an instructor profile
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The Instructor/User ID
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  example: approved
      responses:
        200:
          description: Instructor verification updated successfully

  /admin/users/{id}:
    delete:
      summary: Permanently delete a user account
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The User ID to delete
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: User deleted successfully

  # 📚 ──────────────── COURSE ROUTES ────────────────
  /courses:
    post:
      summary: Create a new course with full curriculum (Instructor Only)
      tags:
        - Course Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - subtitle
                - description
                - price
                - category
              properties:
                title:
                  type: string
                  example: "Mastering Next.js 15 & TypeScript"
                subtitle:
                  type: string
                  example: "Build production-ready web apps with modern tech stack."
                description:
                  type: string
                  example: "Comprehensive guide to Next.js App Router and Advanced Type Safety."
                price:
                  type: number
                  example: 49.99
                estimatedPrice:
                  type: number
                  example: 99.99
                thumbnail:
                  type: string
                  example: "https://placeholder.com/course-thumbnail.png"
                category:
                  type: string
                  example: "Web Development"
                level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                  example: Beginner
                language:
                  type: string
                  enum: ["বাংলা", "English"]
                  example: "বাংলা"
                tags:
                  type: array
                  items:
                    type: string
                  example: ["nextjs", "react", "typescript"]
                hasCertificate:
                  type: boolean
                  example: true
                requirements:
                  type: array
                  items:
                    type: string
                  example:
                    ["Basic HTML, CSS and JavaScript", "ES6+ concepts cleared"]
                whatYouLearn:
                  type: array
                  items:
                    type: string
                  example:
                    [
                      "Next.js 15 App Routing Architecture",
                      "Advanced Server Side Rendering (SSR)",
                    ]
                totalDuration:
                  type: string
                  example: "12 hrs 30 mins"
                sections:
                  type: array
                  items:
                    type: object
                    required:
                      - title
                      - order
                    properties:
                      title:
                        type: string
                        example: "Getting Started with Next.js"
                      order:
                        type: number
                        example: 1
                      lessons:
                        type: array
                        items:
                          type: object
                          required:
                            - title
                            - order
                          properties:
                            title:
                              type: string
                              example: "Installation & Setup"
                            duration:
                              type: string
                              example: "08:45"
                            videoUrl:
                              type: string
                              example: "https://vimeo.com/xyz123"
                            isFree:
                              type: boolean
                              example: true
                            order:
                              type: number
                              example: 1
      responses:
        201:
          description: Course created successfully as a draft
        400:
          description: Please provide all required fields
        401:
          description: Instructor authentication failed

    get:
      summary: Get all published courses with advanced filtering (Public)
      tags:
        - Course Management
      security: [] # Public
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [Beginner, Intermediate, Advanced]
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: ["বাংলা", "English"]
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
        - name: rating
          in: query
          required: false
          schema:
            type: number
        - name: certificate
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                "Most Popular",
                "Highest Rated",
                "Newest",
                "Price: Low to High",
                "Price: High to Low",
              ]
        - name: page
          in: query
          required: false
          schema:
            type: string
            default: "1"
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: "12"
      responses:
        200:
          description: Courses fetched successfully

  /courses/admin/courses:
    get:
      summary: Get all courses for admin dashboard (Admin Only)
      tags:
        - Course Management
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, draft, pending, published, rejected]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
            default: "1"
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: "10"
      responses:
        200:
          description: Admin course list fetched successfully
        401:
          description: Unauthorized - Invalid or missing token
        403:
          description: Forbidden - Admin access required

  /courses/admin/course-stats:
    get:
      summary: Get course management overview stats (Admin Only)
      tags:
        - Course Management
      responses:
        200:
          description: Course management overview statistics fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User management stats fetched successfully"
                  data:
                    type: object
                    properties:
                      totalCourses:
                        type: number
                        example: 45
                      published:
                        type: number
                        example: 30
                      pending:
                        type: number
                        example: 10
                      rejected:
                        type: number
                        example: 5
        401:
          description: Unauthorized - Invalid or missing token
        403:
          description: Forbidden - Admin access required

  /courses/{slug}:
    get:
      summary: Get a single published course details by slug (Public)
      tags:
        - Course Management
      security: [] # Public
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "mastering-next-js-15-typescript"
      responses:
        200:
          description: Course fetched successfully
          content:
            application/json:
              schema:
                type: object
        404:
          description: Course not found

  /courses/instructor/my-courses:
    get:
      summary: Get instructor's own dashboard courses
      tags:
        - Course Management
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, draft, pending, published, rejected]
        - name: page
          in: query
          required: false
          schema:
            type: string
            default: "1"
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: "10"
      responses:
        200:
          description: Instructor courses fetched successfully

  /courses/{id}:
    patch:
      summary: Update course content or Submit a Publish Request (Own Course Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                subtitle:
                  type: string
                description:
                  type: string
                price:
                  type: number
                estimatedPrice:
                  type: number
                thumbnail:
                  type: string
                category:
                  type: string
                level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                language:
                  type: string
                  enum: ["বাংলা", "English"]
                tags:
                  type: array
                  items:
                    type: string
                hasCertificate:
                  type: boolean
                requirements:
                  type: array
                  items:
                    type: string
                whatYouLearn:
                  type: array
                  items:
                    type: string
                totalDuration:
                  type: string
                status:
                  type: string
                  enum: [draft, pending]
                  description: Pass 'pending' to request admin approval (Publish Request). Directly setting 'published' is forbidden.
                  example: pending
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      order:
                        type: number
                      lessons:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            duration:
                              type: string
                            videoUrl:
                              type: string
                            isFree:
                              type: boolean
                            order:
                              type: number
      responses:
        200:
          description: Course updated / Publish request submitted successfully
        400:
          description: Invalid status update request
        403:
          description: Forbidden - Instructors cannot publish courses directly
        404:
          description: Course not found or unauthorized

    delete:
      summary: Delete a course entirely (Own Instructor or Admin Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: Course deleted successfully from EduNext
        404:
          description: Course not found or unauthorized

  /courses/{id}/status:
    patch:
      summary: Approve, reject, or change course status (Admin Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [draft, pending, published, rejected]
                  example: published
                rejectedReason:
                  type: string
                  example: "Thumbnail quality is low and audio requirements are unmet."
                badge:
                  type: string
                  enum: ["Best Seller", "Top Rated", "New"]
                  example: "New"
      responses:
        200:
          description: Course status updated successfully
        400:
          description: Rejection reason is required or invalid status
        404:
          description: Course not found

  # 💳 ──────────────── ENROLLMENT ROUTES ────────────────
  /enrollments/enroll:
    post:
      summary: Enroll/Purchase a course (Student Only)
      tags:
        - Course Enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
              properties:
                courseId:
                  type: string
                  example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        201:
          description: Successfully enrolled in the course
        400:
          description: Already enrolled or invalid request
        403:
          description: Unauthorized

  /enrollments/my-enrolled:
    get:
      summary: Get current student's enrolled courses list
      tags:
        - Course Enrollment
      responses:
        200:
          description: Enrolled courses fetched successfully

  # ⭐️ ──────────────── RATING & REVIEWS ROUTES ────────────────
  /reviews:
    post:
      summary: Add a rating and review to a purchased course (Student Only)
      tags:
        - Course Reviews & Ratings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - rating
                - comment
              properties:
                courseId:
                  type: string
                  example: "65f8a1b2c3d4e5f6a7b8c9d0"
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: "This Next.js course is pixel-perfect! Totally worth the money."
      responses:
        201:
          description: Review added successfully
        403:
          description: You must purchase the course before leaving a review

  /reviews/course/{courseId}:
    get:
      summary: Get all public reviews for a specific course
      tags:
        - Course Reviews & Ratings
      security: [] # Public
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: Reviews fetched successfully

  # 🎥 ──────────────── LIVE SESSIONS ROUTES ────────────────
  # 📊 ──────────────── LIVE SESSIONS ANALYTICS (STATS) ────────────────
  /live-sessions/student/stats:
    get:
      summary: Get live session analytics for student dashboard
      description: Returns separate total counts for Live Now, Upcoming, and Attended live sessions based on courses the authenticated student is enrolled in.
      tags:
        - Live Sessions Management
      responses:
        200:
          description: Student live session stats fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Student live session stats fetched successfully"
                  data:
                    type: object
                    properties:
                      liveNow:
                        type: number
                        example: 1
                      upcoming:
                        type: number
                        example: 2
                      attended:
                        type: number
                        example: 2

  /live-sessions/instructor/stats:
    get:
      summary: Get live session analytics for instructor dashboard
      description: Returns separate total counts for Live Now, Upcoming, and Completed live sessions managed by the authenticated instructor.
      tags:
        - Live Sessions Management
      responses:
        200:
          description: Instructor live session stats fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Instructor live session stats fetched successfully"
                  data:
                    type: object
                    properties:
                      liveNow:
                        type: number
                        example: 1
                      upcoming:
                        type: number
                        example: 2
                      completed:
                        type: number
                        example: 1

  # 🎥 ──────────────── DASHBOARD SESSION LISTINGS ────────────────
  /live-sessions/student/dashboard:
    get:
      summary: Get all filtered live sessions for enrolled student dashboard
      description: Fetches a dynamic list of live sessions belonging to student's enrolled courses, filtered by tab state.
      tags:
        - Live Sessions Management
      parameters:
        - name: status
          in: query
          description: Filter data based on active tab selection (all, live, upcoming, completed)
          required: false
          schema:
            type: string
            enum: [all, live, upcoming, completed]
            default: all
      responses:
        200:
          description: Enrolled student sessions fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Student dashboard live sessions fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: "65f8a1b2c3d4e5f6a7b8c9d9"
                        title:
                          type: string
                          example: "React Advanced Patterns & Hooks"
                        description:
                          type: string
                          example: "Deep dive into context optimization and custom hooks."
                        meetingLink:
                          type: string
                          example: "https://zoom.us/j/12345678"
                        meetingPlatform:
                          type: string
                          enum: [Zoom, Google Meet, Custom]
                          example: "Zoom"
                        startTime:
                          type: string
                          format: date-time
                          example: "2026-06-16T19:00:00.000Z"
                        durationInMins:
                          type: number
                          example: 90
                        status:
                          type: string
                          enum: [live, upcoming, completed]
                          example: "live"
                        course:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "65f8a1b2c3d4e5f6a7b8c9d0"
                            title:
                              type: string
                              example: "Complete Web Development Bootcamp"
                        instructor:
                          type: object
                          properties:
                            firstName:
                              type: string
                              example: "Md. Rafiqul"
                            lastName:
                              type: string
                              example: "Islam"
                            avatar:
                              type: string
                              example: "https://placeholder.com/avatar.png"

  /live-sessions/instructor/dashboard:
    get:
      summary: Get all filtered live sessions created by the instructor
      description: Fetches a dynamic list of live sessions created by the instructor, including total dynamic registered users.
      tags:
        - Live Sessions Management
      parameters:
        - name: status
          in: query
          description: Filter data based on active tab selection (all, live, upcoming, completed)
          required: false
          schema:
            type: string
            enum: [all, live, upcoming, completed]
            default: all
      responses:
        200:
          description: Instructor sessions fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Instructor dashboard live sessions fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: "65f8a1b2c3d4e5f6a7b8c9d9"
                        title:
                          type: string
                          example: "Node.js Architecture & Streams"
                        description:
                          type: string
                          example: "Understanding Event Loop and handling heavy server data streams."
                        meetingLink:
                          type: string
                          example: "https://meet.google.com/abc-defg-hij"
                        meetingPlatform:
                          type: string
                          enum: [Zoom, Google Meet, Custom]
                          example: "Google Meet"
                        startTime:
                          type: string
                          format: date-time
                          example: "2026-06-17T15:00:00.000Z"
                        durationInMins:
                          type: number
                          example: 60
                        status:
                          type: string
                          enum: [live, upcoming, completed]
                          example: "upcoming"
                        totalUsersRegistered:
                          type: number
                          description: Total count of users enrolled in the session's parent course
                          example: 45
                        course:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "65f8a1b2c3d4e5f6a7b8c9d0"
                            title:
                              type: string
                              example: "Complete Web Development Bootcamp"

  # 🛠️ ──────────────── CRUD OPERATIONS & COURSE LISTINGS ────────────────
  /live-sessions:
    post:
      summary: Schedule a new live session (Instructor Only)
      tags:
        - Live Sessions Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - title
                - description
                - meetingLink
                - meetingPlatform
                - startTime
                - durationInMins
              properties:
                courseId:
                  type: string
                  example: "65f8a1b2c3d4e5f6a7b8c9d0"
                title:
                  type: string
                  example: "React Advanced Patterns & Hooks"
                description:
                  type: string
                  example: "Deep dive into context optimization and custom hooks."
                meetingLink:
                  type: string
                  example: "https://zoom.us/j/1234567890"
                meetingPlatform:
                  type: string
                  enum: [Zoom, Google Meet, Custom]
                  example: "Zoom"
                startTime:
                  type: string
                  format: date-time
                  example: "2026-06-16T19:00:00.000Z"
                durationInMins:
                  type: number
                  example: 90
      responses:
        201:
          description: Live session scheduled successfully
        400:
          description: Missing required fields or invalid data

  /live-sessions/course/{courseId}:
    get:
      summary: Get all live sessions assigned to a specific course
      description: Verifies roles and access configurations before populating all sessions matching a target course ID.
      tags:
        - Live Sessions Management
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: Course specific live sessions fetched successfully

  /live-sessions/{sessionId}:
    patch:
      summary: Update details, meeting credentials, or status of a session
      tags:
        - Live Sessions Management
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d9"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                meetingLink:
                  type: string
                  example: "https://zoom.us/j/1234567890"
                meetingPlatform:
                  type: string
                  enum: [Zoom, Google Meet, Custom]
                startTime:
                  type: string
                  format: date-time
                durationInMins:
                  type: number
                status:
                  type: string
                  enum: [upcoming, live, completed]
                  example: "live"
      responses:
        200:
          description: Live session updated successfully
        404:
          description: Session not found or instructor unauthorized
