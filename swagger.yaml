openapi: 3.0.0
info:
  title: EduNext API Documentation
  version: 1.0.0
  description: API documentation for EduNext E-Learning Marketplace Platform - Developed by Aditto Dev
servers:
  - url: https://edunext-apis.onrender.com/api/v1
    description: Production Server (Render)
  - url: http://localhost:5000/api/v1
    description: Local Development Server



security:
  - bearerAuth: []

components:

  schemas:
    Payment:
      type: object
      properties:
        _id: { type: string }
        student: { type: string }
        course: { type: string }
        instructor: { type: string }
        enrollment: { type: string }
        tranId: { type: string }
        amount: { type: number }
        commissionRate: { type: number }
        commissionAmount: { type: number }
        instructorEarning: { type: number }
        status:
          type: string
          enum: [pending, paid, failed, cancelled, refunded]
        payoutStatus:
          type: string
          enum: [not_applicable, available, withdrawal_pending, withdrawn]
        paidAt: { type: string, format: date-time }
        refund:
          type: object
          properties:
            status:
              type: string
              enum: [none, requested, approved, rejected, refunded]
            reason: { type: string }
            requestedAt: { type: string, format: date-time }
            processedAt: { type: string, format: date-time }
            refundRefId: { type: string }
            refundedAmount: { type: number }

    Withdrawal:
      type: object
      properties:
        _id: { type: string }
        instructor: { type: string }
        amount: { type: number }
        payments:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
        accountInfo: { type: string }
        adminNote: { type: string }
        requestedAt: { type: string, format: date-time }
        processedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token here (Without 'Bearer ' prefix).


paths:
  /auth/signup:
    post:
      summary: Register a new user (Student/Instructor)
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
                - password
                - role
              properties:
                firstName:
                  type: string
                  example: Aditto
                lastName:
                  type: string
                  example: Dev
                email:
                  type: string
                  example: aditto@example.com
                phone:
                  type: string
                  example: "01712345678"
                password:
                  type: string
                  example: "password123"
                role:
                  type: string
                  enum: [student, instructor]
                  example: instructor
                areaOfExpertise:
                  type: array
                  description: Required only if role is 'instructor'
                  items:
                    type: string
                  example: ["Next.js", "TypeScript", "React"]
      responses:
        201:
          description: Registration successful. OTP sent to email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Registration completed successfully. Verification OTP sent to your email."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "60a75b..."
                      email:
                        type: string
                        example: aditto@example.com
                      role:
                        type: string
                        example: instructor
        400:
          description: Validation error / Missing fields / Account already exists

  /auth/login:
    post:
      summary: Login user and get token
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: aditto@example.com
                password:
                  type: string
                  example: "password123"
      responses:
        200:
          description: Logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Authentication successful. Welcome back!"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "60a75b..."
                      fullName:
                        type: string
                        example: Aditto Dev
                      email:
                        type: string
                        example: aditto@example.com
                      role:
                        type: string
                        example: instructor
                      badge:
                        type: string
                        example: "none"
        400:
          description: Missing email or password
        401:
          description: Email not registered / Incorrect credentials
        403:
          description: Email not verified / Account suspended

  /auth/verify-otp:
    post:
      summary: Verify user email with OTP
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  example: aditto@example.com
                otp:
                  type: string
                  example: "123456"
      responses:
        200:
          description: Email identity verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Email identity verified successfully."
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "60a75b..."
                      fullName:
                        type: string
                        example: Aditto Dev
                      email:
                        type: string
                        example: aditto@example.com
                      role:
                        type: string
                        example: instructor
        400:
          description: Invalid or expired OTP / Missing fields
        404:
          description: User account not found

  /auth/resend-otp:
    post:
      summary: Resend a fresh verification OTP
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: aditto@example.com
      responses:
        200:
          description: Fresh OTP dispatched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "A fresh verification OTP has been dispatched to your email."
        400:
          description: Email parameter is required
        404:
          description: No user account linked to this email

  /auth/forgot-password:
    post:
      summary: Request a recovery OTP code for forgotten password
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: aditto@example.com
      responses:
        200:
          description: Password recovery OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "A password recovery code has been routed to your email."
        400:
          description: Account email is required
        404:
          description: No account associated with this email

  /auth/verify-reset-otp:
    post:
      summary: Verify reset OTP — Step 2 of password reset
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  example: aditto@example.com
                otp:
                  type: string
                  example: "123456"
      responses:
        200:
          description: OTP verified, returns a short-lived resetToken (valid 15 min)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "OTP verified successfully. You can now reset your password."
                  data:
                    type: object
                    properties:
                      resetToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        400:
          description: Email or OTP missing / Wrong or expired OTP

  /auth/reset-password:
    post:
      summary: Reset password using resetToken — Step 3 of password reset
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resetToken
                - newPassword
              properties:
                resetToken:
                  type: string
                  description: The short-lived JWT token returned from /auth/verify-reset-otp
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                newPassword:
                  type: string
                  example: "newSecurePass123"
      responses:
        200:
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Your account password has been reset successfully. Proceed to login."
        400:
          description: Missing parameters / Password too short
        401:
          description: Invalid or expired reset token

  /auth/change-password:
    patch:
      summary: Change account password while logged in
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: "password123"
                newPassword:
                  type: string
                  example: "myNewSecretPassword99"
      responses:
        200:
          description: Security password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Security password updated successfully."
        400:
          description: Missing required fields / New password too short
        401:
          description: Current password statement is incorrect
        404:
          description: User session not found


  /auth/profile:
    get:
      summary: Fetch user profile dashboard with completion progress
      description: |
        Returns the profile of the authenticated user. 
        The response is **role-specific**:
        - **Admin**: `firstName`, `lastName`, `email`, `phone`, `avatar`, `role`, `isEmailVerified`
        - **Student**: all admin fields + `bio`, `linkedinUrl`, `githubUrl`, `skills`, `badge`, `badgeRequest`
        - **Instructor**: all admin fields + `bio`, `coverPhoto`, `linkedinUrl`, `areaOfExpertise`, `experienceYears`, `badge`, `badgeRequest`
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profile dashboard details returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  profileProgress:
                    type: string
                    example: "60%"
                  user:
                    type: object
                    description: Role-specific user profile fields
        404:
          description: Profile not found

  /auth/profile-update:
    patch:
      summary: Update profile details and calculate live completion progress
      description: |
        Updates the profile of the authenticated user. Only role-relevant fields are accepted:
        - **All roles**: `firstName`, `lastName`, `phone`, `avatar`
        - **Student & Instructor**: `bio`, `linkedinUrl`
        - **Student only**: `githubUrl`, `skills` (array of strings)
        - **Instructor only**: `coverPhoto`, `areaOfExpertise` (array of strings), `experienceYears`
        - **Admin**: only `firstName`, `lastName`, `phone`, `avatar`
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: Aditto
                  description: All roles
                lastName:
                  type: string
                  example: Dev
                  description: All roles
                phone:
                  type: string
                  example: "01712345678"
                  description: All roles
                avatar:
                  type: string
                  example: "https://example.com/uploads/avatar.jpg"
                  description: All roles
                bio:
                  type: string
                  example: "Senior Frontend Web Developer specializing in UI UX"
                  description: Student & Instructor only
                linkedinUrl:
                  type: string
                  example: "https://linkedin.com/in/adittodev"
                  description: Student & Instructor only
                githubUrl:
                  type: string
                  example: "https://github.com/adittodev"
                  description: Student only
                skills:
                  type: array
                  items:
                    type: string
                  example: ["React", "Next.js", "TypeScript"]
                  description: Student only (saved as areaOfExpertise)
                coverPhoto:
                  type: string
                  example: "https://example.com/uploads/cover.jpg"
                  description: Instructor only
                areaOfExpertise:
                  type: array
                  items:
                    type: string
                  example: ["Node.js", "TypeScript", "MongoDB"]
                  description: Instructor only
                experienceYears:
                  type: number
                  example: 5
                  description: Instructor only
      responses:
        200:
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profile dashboard updated successfully."
                  profileProgress:
                    type: string
                    example: "80%"
                  user:
                    type: object
                    description: Updated role-specific user profile fields
        404:
          description: User account not found

  /auth/request-badge:
    post:
      summary: Apply for a milestone profile tier badge (bronze, silver, blue)
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetBadge
              properties:
                targetBadge:
                  type: string
                  enum: [bronze, silver, blue]
                  example: silver
      responses:
        200:
          description: Badge request queued for admin review
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Your application for SILVER tier badge has been queued for admin verification."
        400:
          description: Invalid badge type / Insufficient profile completion percentage
        404:
          description: User details not found

  /auth/change-password:
    patch:
      summary: Change account password while logged in
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: "password123"
                newPassword:
                  type: string
                  example: "myNewSecretPassword99"
      responses:
        200:
          description: Security password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Security password updated successfully."
        400:
          description: Missing required fields / New password too short
        401:
          description: Current password statement is incorrect
        404:
          description: User session not found

  /upload/image:
    post:
      summary: Upload an image file (e.g. avatar, thumbnail) to Cloudinary
      tags:
        - Upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file to upload (max 5MB)
      responses:
        200:
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Image uploaded successfully"
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: "https://res.cloudinary.com/demo/image/upload/v1234567890/edunext_images/xyz.png"
                      publicId:
                        type: string
                        example: "edunext_images/xyz"
                      format:
                        type: string
                        example: "png"
        400:
          description: No image file provided or file type not supported
        500:
          description: Image upload failed

  /admin/user-stats:
    get:
      summary: Get user management stats cards data (Admin Only)
      tags:
        - Super Admin Actions
      responses:
        200:
          description: Stats fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User management stats fetched successfully"
                  data:
                    type: object
                    properties:
                      totalUsers:
                        type: number
                        example: 7
                      totalStudents:
                        type: number
                        example: 4
                      totalInstructors:
                        type: number
                        example: 3
                      totalSuspended:
                        type: number
                        example: 2
        403:
          description: Forbidden - Admin access required

  /admin/users:
    get:
      summary: Get all registered users with search & pagination (Admin Only)
      tags:
        - Super Admin Actions
      parameters:
        - name: search
          in: query
          required: false
          description: Search by first name, last name, or email (case-insensitive)
          schema:
            type: string
            example: "aditto"
        - name: role
          in: query
          required: false
          description: Filter by user role
          schema:
            type: string
            enum: [student, instructor, admin]
        - name: status
          in: query
          required: false
          description: Filter by account status
          schema:
            type: string
            enum: [active, suspended]
        - name: isVerified
          in: query
          required: false
          description: Filter by email verification status
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Number of users per page (max 50, default 10)
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        200:
          description: Users fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Users fetched successfully"
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "65f8a1b2c3d4e5f6a7b8c9d0"
                            firstName:
                              type: string
                              example: "Aditto"
                            lastName:
                              type: string
                              example: "Dev"
                            email:
                              type: string
                              example: "aditto@example.com"
                            role:
                              type: string
                              example: "instructor"
                            isSuspended:
                              type: boolean
                              example: false
                            isVerified:
                              type: boolean
                              example: true
                            createdAt:
                              type: string
                              example: "2025-01-15T10:00:00.000Z"
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                            example: 45
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 10
                          totalPages:
                            type: integer
                            example: 5
        401:
          description: Unauthorized - Invalid or missing token
        403:
          description: Forbidden - Admin access required

  /admin/users/{id}/status:
    patch:
      summary: Suspend or Activate a user account
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The User ID
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, suspended]
                  example: suspended
      responses:
        200:
          description: User status updated successfully

  /admin/instructors/{id}/verify:
    patch:
      summary: Verify or Reject an instructor profile
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The Instructor/User ID
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  example: approved
      responses:
        200:
          description: Instructor verification updated successfully

  /admin/users/{id}:
    delete:
      summary: Permanently delete a user account
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The User ID to delete
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: User deleted successfully

  /courses:
    post:
      summary: Create a new course with full curriculum (Instructor Only)
      tags:
        - Course Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - subtitle
                - description
                - price
                - category
              properties:
                title:
                  type: string
                  example: "Mastering Next.js 15 & TypeScript"
                subtitle:
                  type: string
                  example: "Build production-ready web apps with modern tech stack."
                description:
                  type: string
                  example: "Comprehensive guide to Next.js App Router and Advanced Type Safety."
                price:
                  type: number
                  example: 49.99
                estimatedPrice:
                  type: number
                  example: 99.99
                thumbnail:
                  type: string
                  example: "https://placeholder.com/course-thumbnail.png"
                category:
                  type: string
                  example: "Web Development"
                level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                  example: Beginner
                language:
                  type: string
                  enum: ["Bangla", "English", "Hindi"]
                  example: "Bangla"
                tags:
                  type: array
                  items:
                    type: string
                  example: ["nextjs", "react", "typescript"]
                hasCertificate:
                  type: boolean
                  example: true
                requirements:
                  type: string
                  example: "<p>Basic HTML, CSS and JavaScript</p>"
                whatYouLearn:
                  type: string
                  example: "<p>Next.js 15 App Routing Architecture</p>"
                sections:
                  type: array
                  items:
                    type: object
                    required:
                      - title
                      - order
                    properties:
                      title:
                        type: string
                        example: "Getting Started with Next.js"
                      order:
                        type: number
                        example: 1
                      lessons:
                        type: array
                        items:
                          type: object
                          required:
                            - title
                            - order
                          properties:
                            title:
                              type: string
                              example: "Installation & Setup"
                            duration:
                              type: string
                              example: "08:45"
                            videoUrl:
                              type: string
                              example: "https://vimeo.com/xyz123"
                            isFree:
                              type: boolean
                              example: true
                            order:
                              type: number
                              example: 1
      responses:
        201:
          description: Course created successfully as a draft
        400:
          description: Please provide all required fields
        401:
          description: Instructor authentication failed

    get:
      summary: Get all published courses with advanced filtering (Public)
      tags:
        - Course Management
      security: [] # Public
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [Beginner, Intermediate, Advanced]
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: ["Bangla", "English", "Hindi"]
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
        - name: rating
          in: query
          required: false
          schema:
            type: number
        - name: certificate
