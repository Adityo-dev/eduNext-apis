        '404':
          description: Course not found
    get:
      summary: Get the authenticated user's wishlist
      tags:
        - Wishlist
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (default 1)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Results per page (default 10, max 50)
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Wishlist fetched successfully

  /wishlists/{courseId}:
