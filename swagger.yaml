  /reviews/admin/{reviewId}/publish:
    patch:
      summary: Publish a pending review (Admin Only)
      description: >
        Sets the review `status` to `published`.
        After publishing, the course's **average rating is recalculated** using only published reviews.
      tags:
        - Course Reviews & Ratings
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9e2"
          description: The MongoDB ObjectId of the review to publish
      responses:
        200:
          description: Review published and course rating updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Review published successfully
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      status:
                        type: string
                        example: published
                      rating:
                        type: number
                        example: 5
                      comment:
                        type: string
        400:
          description: Invalid reviewId or review already published
        401:
          description: Unauthorized â€” token required
        403:
          description: Only admins can access this endpoint
        404:
          description: Review not found

  /reviews/admin/{reviewId}/reject:
    patch:
      summary: Reject a pending review with reason (Admin Only)
      description: >
        Sets the review `status` to `rejected` and saves the provided `rejectionReason`.
        The **rejection reason is required**.
        After rejection, the course's average rating is recalculated (excluding this review).
      tags:
        - Course Reviews & Ratings
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9e2"
          description: The MongoDB ObjectId of the review to reject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rejectionReason
              properties:
                rejectionReason:
                  type: string
                  example: This review contains inappropriate language and violates our community guidelines.
                  description: A clear reason explaining why the review was rejected (shown to admin records)
      responses:
        200:
          description: Review rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Review rejected successfully
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      status:
                        type: string
                        example: rejected
                      rejectionReason:
                        type: string
                        example: This review contains inappropriate language.
                      rating:
                        type: number
                        example: 1
                      comment:
                        type: string
        400:
          description: Invalid reviewId, rejection reason missing, or review already rejected
        401:
          description: Unauthorized â€” token required
        403:
          description: Only admins can access this endpoint
        404:
          description: Review not found



