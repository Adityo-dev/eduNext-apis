      description: Schedules a new live session with status 'upcoming'. A reminder email will be automatically sent to enrolled students 10 minutes before the startTime.
      tags:
        - Live Sessions Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - title
                - description
                - meetingLink
                - meetingPlatform
                - startTime
                - durationInMins
              properties:
                courseId:
                  type: string
                  example: "65f8a1b2c3d4e5f6a7b8c9d0"
                title:
                  type: string
                  example: "React Advanced Patterns & Hooks"
                description:
                  type: string
                  example: "Deep dive into context optimization and custom hooks."
                meetingLink:
                  type: string
                  example: "https://zoom.us/j/1234567890"
                meetingPlatform:
                  type: string
                  enum: [Zoom, Google Meet, Custom]
                  example: "Zoom"
                startTime:
                  type: string
                  format: date-time
                  example: "2026-06-16T19:00:00.000Z"
                durationInMins:
                  type: number
                  example: 90
      responses:
        201:
          description: Live session scheduled successfully
        400:
          description: Missing required fields or invalid data

  /live-sessions/course/{courseId}:
    get:
      summary: Get all live sessions assigned to a specific course
      description: Verifies roles and access configurations before populating all sessions matching a target course ID. Hides meeting links for students if the session status is upcoming.
      tags:
        - Live Sessions Management
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: Course specific live sessions fetched successfully

  /live-sessions/{sessionId}:
    patch:
      summary: Update details, meeting credentials, or status of a session
      description: Updating the status to 'live' will instantly trigger an email notification to all enrolled students with the meeting link.
      tags:
        - Live Sessions Management
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d9"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                meetingLink:
                  type: string
                  example: "https://zoom.us/j/1234567890"
                meetingPlatform:
                  type: string
                  enum: [Zoom, Google Meet, Custom]
                startTime:
                  type: string
                  format: date-time
                durationInMins:
                  type: number
                status:
                  type: string
                  enum: [upcoming, live, completed]
                  example: "live"
      responses:
        200:
          description: Live session updated successfully
        404:
          description: Session not found or instructor unauthorized

  /live-sessions/{sessionId}/join:
