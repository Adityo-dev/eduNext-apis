          description: The MongoDB ObjectId of the user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, suspended]
                  example: suspended
                  description: The new account status to apply
                reason:
                  type: string
                  example: "Violation of terms of service"
                  description: Mandatory if status is 'suspended'. The reason will be sent to the user via email.
      responses:
        200:
          description: User status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
