openapi: 3.0.0
info:
  title: EduNext API Documentation
  version: 1.0.0
  description: API documentation for EduNext E-Learning Marketplace Platform - Developed by Aditto Dev
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server

# ── global security ──
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token here (Without 'Bearer ' prefix).

paths:
  # 🌐 ──────────────── AUTH ROUTES ────────────────
  /auth/signup:
    post:
      summary: Register a new user (Student/Instructor with Expertise)
      tags:
        - Authentication
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
                - password
                - role
              properties:
                firstName:
                  type: string
                  example: Aditto
                lastName:
                  type: string
                  example: Dev
                email:
                  type: string
                  example: aditto@example.com
                phone:
                  type: string
                  example: "01712345678"
                password:
                  type: string
                  example: "password123"
                role:
                  type: string
                  enum: [student, instructor]
                  example: instructor
                areaOfExpertise:
                  type: array
                  description: Required only if role is 'instructor'
                  items:
                    type: string
                  example: ["Next.js", "TypeScript", "React"]
      responses:
        201:
          description: Registration successful
        400:
          description: Validation error (e.g., Instructors must provide at least one area of expertise)

  /auth/login:
    post:
      summary: Login user and get token
      tags:
        - Authentication
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: aditto@example.com
                password:
                  type: string
                  example: "password123"
      responses:
        200:
          description: Logged in successfully
        400:
          description: Please provide email and password
        401:
          description: Invalid email or password

  # 👑 ──────────────── SUPER ADMIN ROUTES ────────────────
  /admin/user-stats:
    get:
      summary: Get user management stats cards data (Admin Only)
      tags:
        - Super Admin Actions
      responses:
        200:
          description: Stats fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User management stats fetched successfully"
                  data:
                    type: object
                    properties:
                      totalUsers:
                        type: number
                        example: 7
                      totalStudents:
                        type: number
                        example: 4
                      totalInstructors:
                        type: number
                        example: 3
                      totalSuspended:
                        type: number
                        example: 2
        403:
          description: Forbidden - Admin access required

  /admin/users:
    get:
      summary: Get all registered users (Admin Only)
      tags:
        - Super Admin Actions
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [student, instructor, admin]
      responses:
        200:
          description: List of users retrieved successfully

  /admin/users/{id}/status:
    patch:
      summary: Suspend or Activate a user account
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The User ID
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, suspended]
                  example: suspended
      responses:
        200:
          description: User status updated successfully

  /admin/instructors/{id}/verify:
    patch:
      summary: Verify or Reject an instructor profile
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The Instructor/User ID
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  example: approved
      responses:
        200:
          description: Instructor verification updated successfully

  /admin/users/{id}:
    delete:
      summary: Permanently delete a user account
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The User ID to delete
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: User deleted successfully

  # 📚 ──────────────── COURSE ROUTES ────────────────
  /courses:
    post:
      summary: Create a new course with full curriculum (Instructor Only)
      tags:
        - Course Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - subtitle
                - description
                - price
                - category
              properties:
                title:
                  type: string
                  example: "Mastering Next.js 15 & TypeScript"
                subtitle:
                  type: string
                  example: "Build production-ready web apps with modern tech stack."
                description:
                  type: string
                  example: "Comprehensive guide to Next.js App Router and Advanced Type Safety."
                price:
                  type: number
                  example: 49.99
                estimatedPrice:
                  type: number
                  example: 99.99
                thumbnail:
                  type: string
                  example: "https://placeholder.com/course-thumbnail.png"
                category:
                  type: string
                  example: "Web Development"
                level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                  example: Beginner
                language:
                  type: string
                  enum: ["বাংলা", "English"]
                  example: "বাংলা"
                tags:
                  type: array
                  items:
                    type: string
                  example: ["nextjs", "react", "typescript"]
                hasCertificate:
                  type: boolean
                  example: true
                requirements:
                  type: array
                  items:
                    type: string
                  example:
                    ["Basic HTML, CSS and JavaScript", "ES6+ concepts cleared"]
                whatYouLearn:
                  type: array
                  items:
                    type: string
                  example:
                    [
                      "Next.js 15 App Routing Architecture",
                      "Advanced Server Side Rendering (SSR)",
                    ]
                totalDuration:
                  type: string
                  example: "12 hrs 30 mins"
                sections:
                  type: array
                  items:
                    type: object
                    required:
                      - title
                      - order
                    properties:
                      title:
                        type: string
                        example: "Getting Started with Next.js"
                      order:
                        type: number
                        example: 1
                      lessons:
                        type: array
                        items:
                          type: object
                          required:
                            - title
                            - order
                          properties:
                            title:
                              type: string
                              example: "Installation & Setup"
                            duration:
                              type: string
                              example: "08:45"
                            videoUrl:
                              type: string
                              example: "https://vimeo.com/xyz123"
                            isFree:
                              type: boolean
                              example: true
                            order:
                              type: number
                              example: 1
      responses:
        201:
          description: Course created successfully as a draft
        400:
          description: Please provide all required fields
        401:
          description: Instructor authentication failed

    get:
      summary: Get all published courses with advanced filtering (Public)
      tags:
        - Course Management
      security: [] # Public
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [Beginner, Intermediate, Advanced]
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: ["বাংলা", "English"]
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
        - name: rating
          in: query
          required: false
          schema:
            type: number
        - name: certificate
          in: query
          required: false
          schema:
            type: boolean # ফিক্সড: স্ট্রিং থেকে বোলোয়ানে পরিবর্তন করা হয়েছে
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                "Most Popular",
                "Highest Rated",
                "Newest",
                "Price: Low to High",
                "Price: High to Low",
              ]
        - name: page
          in: query
          required: false
          schema:
            type: string
            default: "1"
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: "12"
      responses:
        200:
          description: Courses fetched successfully

  /courses/{slug}:
    get:
      summary: Get a single published course details by slug (Public)
      tags:
        - Course Management
      security: [] # Public
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "mastering-next-js-15-typescript"
      responses:
        200:
          description: Course fetched successfully
          content:
            application/json:
              schema:
                type: object
        404:
          description: Course not found

  /courses/instructor/my-courses:
    get:
      summary: Get instructor's own dashboard courses
      tags:
        - Course Management
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, draft, pending, published, rejected]
        - name: page
          in: query
          required: false
          schema:
            type: string
            default: "1"
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: "10"
      responses:
        200:
          description: Instructor courses fetched successfully

  /courses/{id}:
    patch:
      summary: Update course content (Own Course Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                subtitle:
                  type: string
                description:
                  type: string
                price:
                  type: number
                estimatedPrice:
                  type: number
                thumbnail:
                  type: string
                category:
                  type: string
                level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                language:
                  type: string
                  enum: ["বাংলা", "English"]
                tags:
                  type: array
                  items:
                    type: string
                hasCertificate:
                  type: boolean
                requirements:
                  type: array
                  items:
                    type: string
                whatYouLearn:
                  type: array
                  items:
                    type: string
                totalDuration:
                  type: string
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      order:
                        type: number
                      lessons:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            duration:
                              type: string
                            videoUrl:
                              type: string
                            isFree:
                              type: boolean
                            order:
                              type: number
      responses:
        200:
          description: Course updated successfully
        404:
          description: Course not found or unauthorized

    delete:
      summary: Delete a course entirely (Own Instructor or Admin Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: Course deleted successfully from EduNext
        404:
          description: Course not found or unauthorized

  /courses/{id}/status:
    patch:
      summary: Approve, reject, or change course status (Admin Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [draft, pending, published, rejected]
                  example: published
                rejectedReason:
                  type: string
                  example: "Thumbnail quality is low and audio requirements are unmet."
                badge:
                  type: string
                  enum: ["Best Seller", "Top Rated", "New"]
                  example: "New"
      responses:
        200:
          description: Course status updated successfully
        400:
          description: Rejection reason is required or invalid status
        404:
          description: Course not found

  # 💳 ──────────────── ENROLLMENT ROUTES ────────────────
  /enrollments/enroll:
    post:
      summary: Enroll/Purchase a course (Student Only)
      tags:
        - Course Enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
              properties:
                courseId:
                  type: string
                  example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        201:
          description: Successfully enrolled in the course
        400:
          description: Already enrolled or invalid request
        403:
          description: Unauthorized

  /enrollments/my-enrolled:
    get:
      summary: Get current student's enrolled courses list
      tags:
        - Course Enrollment
      responses:
        200:
          description: Enrolled courses fetched successfully

  # ⭐️ ──────────────── RATING & REVIEWS ROUTES ────────────────
  /reviews:
    post:
      summary: Add a rating and review to a purchased course (Student Only)
      tags:
        - Course Reviews & Ratings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - rating
                - comment
              properties:
                courseId:
                  type: string
                  example: "65f8a1b2c3d4e5f6a7b8c9d0"
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: "This Next.js course is pixel-perfect! Totally worth the money."
      responses:
        201:
          description: Review added successfully
        403:
          description: You must purchase the course before leaving a review

  /reviews/course/{courseId}:
    get:
      summary: Get all public reviews for a specific course
      tags:
        - Course Reviews & Ratings
      security: [] # Public
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: Reviews fetched successfully

  # 🎥 ──────────────── LIVE SESSIONS ROUTES ────────────────
  /live-sessions:
    post:
      summary: Schedule a new live session (Instructor Only)
      tags:
        - Live Sessions Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - title
                - meetingLink
                - startTime
              properties:
                courseId:
                  type: string
                  example: "65f8a1b2c3d4e5f6a7b8c9d0"
                title:
                  type: string
                  example: "Special Q&A on Next.js Server Actions"
                description:
                  type: string
                  example: "Bring your doubts regarding server-side state mutation and security constraints."
                meetingLink:
                  type: string
                  example: "https://meet.google.com/abc-defg-hij"
                meetingPlatform:
                  type: string
                  enum: [Zoom, Google Meet, Custom]
                  example: "Google Meet"
                startTime:
                  type: string
                  format: date-time
                  example: "2026-06-15T20:00:00.000Z"
                durationInMins:
                  type: number
                  example: 60
      responses:
        201:
          description: Live session scheduled successfully
        400:
          description: Missing required fields
        403:
          description: Unauthorized or not your course

  /live-sessions/course/{courseId}:
    get:
      summary: Get all live sessions for a specific course (Enrolled Students/Instructors)
      tags:
        - Live Sessions Management
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: Live sessions fetched successfully
        403:
          description: You must enroll in this course to see live sessions

  /live-sessions/{sessionId}:
    patch:
      summary: Update scheduled live session or status (Instructor Only)
      tags:
        - Live Sessions Management
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d9"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [upcoming, live, completed]
                  example: "live"
                meetingLink:
                  type: string
                  example: "https://zoom.us/j/1234567890"
      responses:
        200:
          description: Live session updated successfully
