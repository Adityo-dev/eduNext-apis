                        type: string
                        example: aditto@example.com
                      isSuspended:
                        type: boolean
                        example: true
        400:
          description: Invalid status value provided
        401:
          description: Unauthorized – token required
        403:
          description: Only admins can access this endpoint
        404:
          description: User not found

