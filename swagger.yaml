  /admin/instructors/{id}/approve:
    patch:
      summary: Approve or reject an instructor's badge request (Admin)
      description: |
        Admin can approve or reject an instructor's pending badge request after reviewing their profile.
        - **approve** → grants the requested badge and sets `badgeRequest.status = approved`
        - **reject** → keeps the current badge and sets `badgeRequest.status = rejected`
      tags:
        - Admin - Instructor Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d1"
          description: The MongoDB ObjectId of the instructor to approve or reject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                  example: approve
                  description: The decision — either approve or reject the instructor's badge request
      responses:
        200:
          description: Instructor approved or rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Instructor badge request has been approved successfully
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: "65f8a1b2c3d4e5f6a7b8c9d1"
                      fullName:
                        type: string
                        example: Aditto Dev
                      email:
                        type: string
                        example: aditto@example.com
                      badge:
                        type: string
                        example: bronze
                      badgeRequest:
                        type: object
                        properties:
                          requestedBadge:
                            type: string
                            example: bronze
                          status:
                            type: string
                            example: approved
                          requestedAt:
                            type: string
                            format: date-time
        400:
          description: Invalid action value or user is not an instructor
        401:
          description: Unauthorized – token required
        403:
          description: Only admins can access this endpoint
        404:
          description: Instructor not found

  /admin/instructors/{id}/cancel-badge:
    patch:
      summary: Cancel an instructor's active badge (Admin)
      description: |
        Admin can revoke an instructor's badge. A reason must be provided, which will be sent to the instructor via email.
        - Sets `badge = "none"`
        - Sets `badgeRequest.status = "none"`
      tags:
        - Admin - Instructor Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d1"
          description: The MongoDB ObjectId of the instructor to cancel badge for
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cancelReason
              properties:
                cancelReason:
                  type: string
                  example: "Violation of our instructor policy guidelines."
                  description: The reason why the badge is being cancelled, which will be emailed to the instructor.
      responses:
        200:
          description: Instructor badge cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Instructor badge has been cancelled successfully, and notification sent.
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: "65f8a1b2c3d4e5f6a7b8c9d1"
                      fullName:
                        type: string
                        example: Aditto Dev
                      email:
                        type: string
                        example: aditto@example.com
                      badge:
                        type: string
                        example: none
                      badgeRequest:
                        type: object
                        properties:
                          requestedBadge:
                            type: string
                            example: none
                          status:
                            type: string
                            example: none
                          requestedAt:
                            type: string
                            format: date-time
        400:
          description: Reason missing or user is not an instructor or has no badge
        401:
          description: Unauthorized – token required
        403:
          description: Only admins can access this endpoint
        404:
          description: Instructor not found

