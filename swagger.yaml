                  type: string
                  example: "Web Development"
                level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                  example: Beginner
                language:
                  type: string
                  enum: ["à¦¬à¦¾à¦‚à¦²à¦¾", "English"]
                  example: "à¦¬à¦¾à¦‚à¦²à¦¾"
                tags:
                  type: array
                  items:
                    type: string
                  example: ["nextjs", "react", "typescript"]
                hasCertificate:
                  type: boolean
