                          type: string
                          format: date-time

  /reviews:
    post:
      summary: Submit a course review (Student Only â€” Enrolled)
      description: >
        A **student** can submit a review for a course they are **enrolled in**.
        The review is saved with `status: pending` and goes to admin for approval.
        Each student can only review a course **once**.
      tags:
        - Course Reviews & Ratings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - rating
                - comment
              properties:
                courseId:
                  type: string
                  example: "65f8a1b2c3d4e5f6a7b8c9d0"
                  description: The MongoDB ObjectId of the enrolled course
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: This course completely changed my life! Best instructor on EduNext.
      responses:
        201:
          description: Review submitted â€” pending admin approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Review submitted successfully. It will be visible after admin approval.
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      student:
                        type: string
                      course:
                        type: string
                      rating:
                        type: number
                        example: 5
                      comment:
                        type: string
                      status:
                        type: string
                        example: pending
                      createdAt:
                        type: string
                        format: date-time
        400:
          description: courseId, rating or comment missing â€” or already reviewed this course
        403:
          description: Not enrolled in this course
        401:
          description: Unauthorized â€” token required

