openapi: 3.0.0
info:
  title: EduNext API Documentation
  version: 1.0.0
  description: API documentation for EduNext E-Learning Marketplace Platform - Developed by Aditto Dev
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server

# ── গ্লোবাল সিকিউরিটি লেয়ার (টোকেন বাটন সচল করবে) ──
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token here (Without 'Bearer ' prefix).

paths:
  # 🌐 ──────────────── AUTH ROUTES ────────────────
  /auth/signup:
    post:
      summary: Register a new user (Student/Instructor)
      tags:
        - Authentication
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
                - password
              properties:
                firstName:
                  type: string
                  example: Aditto
                lastName:
                  type: string
                  example: Dev
                email:
                  type: string
                  example: aditto@example.com
                phone:
                  type: string
                  example: "01712345678"
                password:
                  type: string
                  example: "password123"
                role:
                  type: string
                  enum: [student, instructor]
                  example: student
      responses:
        201:
          description: Registration successful

  /auth/login:
    post:
      summary: Login user and get token
      tags:
        - Authentication
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: aditto@example.com
                password:
                  type: string
                  example: "password123"
      responses:
        200:
          description: Logged in successfully

  # 👑 ──────────────── ADMIN ROUTES ────────────────
  /admin/users:
    get:
      summary: Get all registered users (Admin Only)
      tags:
        - Super Admin Actions
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [student, instructor, admin]
      responses:
        200:
          description: List of users retrieved successfully

  /admin/users/{id}/status:
    patch:
      summary: Suspend or Activate a user account
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The User ID
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, suspended]
                  example: suspended
      responses:
        200:
          description: User status updated successfully

  /admin/instructors/{id}/verify:
    patch:
      summary: Verify or Reject an instructor profile
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The Instructor/User ID
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  example: approved
      responses:
        200:
          description: Instructor verification updated successfully

  /admin/users/{id}:
    delete:
      summary: Permanently delete a user account
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The User ID to delete
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: User deleted successfully

  # 📚 ──────────────── COURSE ROUTES ────────────────
  /courses:
    post:
      summary: Create a new course with full curriculum (Instructor Only)
      tags:
        - Course Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - subtitle
                - description
                - price
                - category
              properties:
                title:
                  type: string
                  example: "Mastering Next.js 15 & TypeScript"
                subtitle:
                  type: string
                  example: "Build production-ready pixel-perfect web apps with modern tech stack."
                description:
                  type: string
                  example: "Comprehensive guide to Next.js App Router, Server Actions, and Advanced Type Safety."
                price:
                  type: number
                  example: 49.99
                estimatedPrice:
                  type: number
                  example: 99.99
                thumbnail:
                  type: string
                  example: "https://placeholder.com/course-thumbnail.png"
                category:
                  type: string
                  example: "Web Development"
                level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                  example: Beginner
                language:
                  type: string
                  enum: ["বাংলা", "English"]
                  example: "বাংলা"
                tags:
                  type: array
                  items:
                    type: string
                  example: ["nextjs", "react", "typescript"]
                hasCertificate:
                  type: boolean
                  example: true
                requirements:
                  type: array
                  items:
                    type: string
                  example:
                    ["Basic HTML, CSS and JavaScript", "ES6+ concepts cleared"]
                whatYouLearn:
                  type: array
                  items:
                    type: string
                  example:
                    [
                      "Next.js 15 App Routing Architecture",
                      "Advanced Server Side Rendering (SSR)",
                    ]
                totalDuration:
                  type: string
                  example: "12 hrs 30 mins"
                sections:
                  type: array
                  items:
                    type: object
                    required:
                      - title
                      - order
                    properties:
                      title:
                        type: string
                        example: "Getting Started with Next.js"
                      order:
                        type: number
                        example: 1
                      lessons:
                        type: array
                        items:
                          type: object
                          required:
                            - title
                            - order
                          properties:
                            title:
                              type: string
                              example: "Installation & Setup"
                            duration:
                              type: string
                              example: "08:45"
                            videoUrl:
                              type: string
                              example: "https://vimeo.com/xyz123"
                            isFree:
                              type: boolean
                              example: true
                            order:
                              type: number
                              example: 1
      responses:
        201:
          description: Course created successfully as a draft
        400:
          description: Please provide all required fields (title, subtitle, description, price, category)
        401:
          description: Instructor authentication failed
  /courses/{slug}:
    get:
      summary: Get a single published course details by slug (Public)
      tags:
        - Course Management
      security: [] # Public
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "mastering-next-js-15-typescript"
      responses:
        200:
          description: Course fetched successfully
        404:
          description: Course not found

  /courses/instructor/my-courses:
    get:
      summary: Get instructor's own dashboard courses
      tags:
        - Course Management
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, draft, pending, published, rejected]
        - name: page
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: Instructor courses fetched successfully

  /courses/{id}:
    patch:
      summary: Update course content (Own Course Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                subtitle:
                  type: string
                description:
                  type: string
                price:
                  type: number
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                        example: "Getting Started with Next.js"
                      order:
                        type: number
                        example: 1
                      lessons:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                              example: "Installation & Setup"
                            duration:
                              type: string
                              example: "08:45"
                            videoUrl:
                              type: string
                              example: "https://vimeo.com/xyz123"
                            isFree:
                              type: boolean
                              example: true
                            order:
                              type: number
                              example: 1
      responses:
        200:
          description: Course updated successfully

    delete:
      summary: Delete a course account (Own Instructor or Admin Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Course deleted successfully

  /courses/{id}/status:
    patch:
      summary: Approve, reject, or change course status (Admin Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [draft, pending, published, rejected]
                  example: published
                rejectedReason:
                  type: string
                  example: "Thumbnail quality is low and audio requirements are unmet."
                badge:
                  type: string
                  enum: ["Best Seller", "Top Rated", "New"]
                  example: "New"
      responses:
        200:
          description: Course status updated successfully
