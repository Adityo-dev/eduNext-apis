  /courses/{id}:
    patch:
      summary: Update course content or Submit a Publish Request (Own Course Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                subtitle:
                  type: string
                description:
                  type: string
                price:
                  type: number
                estimatedPrice:
                  type: number
                thumbnail:
                  type: string
                category:
                  type: string
                level:
                  type: string
                  enum: [Beginner, Intermediate, Advanced]
                language:
                  type: string
                  enum: ["Bangla", "English", "Hindi"]
                tags:
                  type: array
                  items:
                    type: string
                hasCertificate:
                  type: boolean
                requirements:
                  type: string
                whatYouLearn:
                  type: string

                status:
                  type: string
                  enum: [draft, pending]
                  description: Pass 'pending' to request admin approval (Publish Request). Directly setting 'published' is forbidden.
                  example: pending
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      order:
                        type: number
                      lessons:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            duration:
                              type: string
                            videoUrl:
                              type: string
                            isFree:
                              type: boolean
                            order:
                              type: number
      responses:
        200:
          description: Course updated / Publish request submitted successfully
        400:
          description: Invalid status update request
        403:
          description: Forbidden - Instructors cannot publish courses directly
        404:
          description: Course not found or unauthorized

    delete:
      summary: Delete a course entirely (Own Instructor or Admin Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: Course deleted successfully from EduNext
        404:
          description: Course not found or unauthorized

  /courses/{id}/publish-request:
    post:
      summary: Request admin review to publish a draft or rejected course (Instructor Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: Course publish request submitted successfully
