  /reviews/instructor/stats:
    get:
      summary: Get instructor review stats
      tags: [Course Reviews & Ratings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      averageRating:
                        type: number
                        example: 4.3
                      totalReviews:
                        type: integer
                        example: 128
                      starDistribution:
                        type: object
                        properties:
                          '5':
                            type: integer
                          '4':
                            type: integer
                          '3':
                            type: integer
                          '2':
                            type: integer
                          '1':
                            type: integer
  /reviews/instructor/reviews:
    get:
      summary: Get all reviews received by instructor (with search & filters)
      description: >
        Returns all published reviews for the logged-in instructor's courses.
        Supports searching by course title, filtering by courseId or star rating, and pagination.
      tags: [Course Reviews & Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search reviews by course title (case-insensitive, partial match)
          schema:
            type: string
            example: JavaScript
        - name: courseId
          in: query
          description: Filter reviews by a specific course ID
          schema:
            type: string
            example: 64abc123def456
        - name: rating
          in: query
          description: Filter reviews by star rating (1–5)
          schema:
            type: integer
            minimum: 1
            maximum: 5
            example: 5
        - name: page
          in: query
          description: Page number (default 1)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Results per page (default 10, max 50)
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: List of reviews fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        rating:
                          type: integer
                        comment:
                          type: string
                        status:
                          type: string
                          example: published
                        student:
                          type: object
                          properties:
                            _id:
                              type: string
                            firstName:
                              type: string
                            lastName:
                              type: string
                            avatar:
                              type: string
                        course:
                          type: object
                          properties:
                            _id:
                              type: string
                            title:
                              type: string
                            thumbnail:
                              type: string
                        createdAt:
                          type: string
                          format: date-time
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (instructor only)

  /wishlists:
    post:
      summary: Add a course to the user's wishlist
