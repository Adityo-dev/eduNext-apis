    patch:
      summary: Approve, reject, or change course status (Admin Only)
      tags:
        - Course Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [draft, pending, published, rejected, suspended]
                  example: published
                rejectedReason:
                  type: string
                  description: "Required when status is 'rejected'."
                  example: "Thumbnail quality is low and audio requirements are unmet."
                suspendedReason:
                  type: string
                  description: "Required when status is 'suspended'."
                  example: "Instructor violating community guidelines."
                badge:
                  type: string
                  enum: ["Best Seller", "Top Rated", "New"]
                  example: "New"
      responses:
        200:
          description: Course status updated successfully
        400:
          description: Rejection reason is required or invalid status
