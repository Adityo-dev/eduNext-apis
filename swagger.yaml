          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Success
  /reviews/student/unreviewed-courses:
    get:
      summary: Get purchased courses that haven't been reviewed
      tags: [Course Reviews & Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Success
  /reviews/student/{reviewId}:
    put:
      summary: Update a submitted review (Student)
      tags: [Course Reviews & Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Success
  /reviews/admin:
    get:
      summary: Get all reviews with filters (Admin)
      description: >
        Returns paginated reviews. Supports filtering by status and searching by student name or course title.
        When both `status` and `search` are provided, they are combined with AND logic.
        `approved` is accepted as an alias for `published`.
      tags: [Course Reviews & Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: status
          in: query
          description: Filter by review status. Use `all` or omit to get all reviews.
          schema:
            type: string
            enum: [all, pending, published, approved, rejected]
            example: pending
        - name: search
          in: query
          description: Search by student first/last name or course title
          schema:
            type: string
            example: John
      responses:
        '200':
          description: Reviews fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
  /reviews/admin/stats:
    get:
      summary: Get admin review stats
      tags: [Course Reviews & Ratings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Stats fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 150
                      pending:
                        type: integer
                        example: 30
                      published:
                        type: integer
                        example: 100
                      rejected:
                        type: integer
                        example: 20
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)

  /reviews/admin/{reviewId}:
    delete:
      summary: Delete a review (Admin)
      tags: [Course Reviews & Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Success
  /reviews/admin/{reviewId}/publish:
    patch:
      summary: Approve/Publish a review (Admin)
      tags: [Course Reviews & Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
  /reviews/admin/{reviewId}/reject:
    patch:
      summary: Reject a review (Admin)
      tags: [Course Reviews & Ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectionReason]
