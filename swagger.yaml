        200:
          description: Courses fetched successfully

  /courses/admin/courses:
    get:
      summary: Get all courses for admin dashboard (Admin Only)
      tags:
        - Course Management
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, draft, pending, published, rejected]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: string
            default: "1"
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: "10"
      responses:
        200:
          description: Admin course list fetched successfully
        401:
          description: Unauthorized - Invalid or missing token
        403:
          description: Forbidden - Admin access required

  /courses/admin/course-stats:
    get:
      summary: Get course management overview stats (Admin Only)
      tags:
        - Course Management
      responses:
        200:
          description: Course management overview statistics fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User management stats fetched successfully"
                  data:
                    type: object
                    properties:
                      totalCourses:
                        type: number
                        example: 45
                      published:
                        type: number
                        example: 30
                      pending:
                        type: number
                        example: 10
                      rejected:
                        type: number
                        example: 5
        401:
          description: Unauthorized - Invalid or missing token
        403:
          description: Forbidden - Admin access required

  /courses/{slug}:
    get:
      summary: Get a single published course details by slug (Public)
      tags:
        - Course Management
      security: [] # Public
      parameters:
