openapi: 3.0.0
info:
  title: EduNext API Documentation
  version: 1.0.0
  description: API documentation for EduNext E-Learning Marketplace Platform - Developed by Aditto Dev
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
  - url: https://edunext-apis.onrender.com/api/v1
    description: Production Server (Render)



security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token here (Without 'Bearer ' prefix).


paths:
  /auth/signup:
    post:
      summary: Register a new user (Student/Instructor)
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
                - password
                - role
              properties:
                firstName:
                  type: string
                  example: Aditto
                lastName:
                  type: string
                  example: Dev
                email:
                  type: string
                  example: aditto@example.com
                phone:
                  type: string
                  example: "01712345678"
                password:
                  type: string
                  example: "password123"
                role:
                  type: string
                  enum: [student, instructor]
                  example: instructor
                areaOfExpertise:
                  type: array
                  description: Required only if role is 'instructor'
                  items:
                    type: string
                  example: ["Next.js", "TypeScript", "React"]
      responses:
        201:
          description: Registration successful. OTP sent to email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Registration completed successfully. Verification OTP sent to your email."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "60a75b..."
                      email:
                        type: string
                        example: aditto@example.com
                      role:
                        type: string
                        example: instructor
        400:
          description: Validation error / Missing fields / Account already exists

  /auth/login:
    post:
      summary: Login user and get token
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: aditto@example.com
                password:
                  type: string
                  example: "password123"
      responses:
        200:
          description: Logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Authentication successful. Welcome back!"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "60a75b..."
                      fullName:
                        type: string
                        example: Aditto Dev
                      email:
                        type: string
                        example: aditto@example.com
                      role:
                        type: string
                        example: instructor
                      badge:
                        type: string
                        example: "none"
        400:
          description: Missing email or password
        401:
          description: Email not registered / Incorrect credentials
        403:
          description: Email not verified / Account suspended

  /auth/verify-otp:
    post:
      summary: Verify user email with OTP
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  example: aditto@example.com
                otp:
                  type: string
                  example: "123456"
      responses:
        200:
          description: Email identity verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Email identity verified successfully."
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "60a75b..."
                      fullName:
                        type: string
                        example: Aditto Dev
                      email:
                        type: string
                        example: aditto@example.com
                      role:
                        type: string
                        example: instructor
        400:
          description: Invalid or expired OTP / Missing fields
        404:
          description: User account not found

  /auth/resend-otp:
    post:
      summary: Resend a fresh verification OTP
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: aditto@example.com
      responses:
        200:
          description: Fresh OTP dispatched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "A fresh verification OTP has been dispatched to your email."
        400:
          description: Email parameter is required
        404:
          description: No user account linked to this email

  /auth/forgot-password:
    post:
      summary: Request a recovery OTP code for forgotten password
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: aditto@example.com
      responses:
        200:
          description: Password recovery OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "A password recovery code has been routed to your email."
        400:
          description: Account email is required
        404:
          description: No account associated with this email

  /auth/reset-password:
    post:
      summary: Reset password using verification recovery OTP
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - newPassword
              properties:
                email:
                  type: string
                  example: aditto@example.com
                otp:
                  type: string
                  example: "123456"
                newPassword:
                  type: string
                  example: "newSecurePass123"
      responses:
        200:
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Your account password has been reset successfully. Proceed to login."
        400:
          description: Missing parameters / Wrong or expired OTP / Password too short

  /auth/change-password:
    patch:
      summary: Change account password while logged in
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: "password123"
                newPassword:
                  type: string
                  example: "myNewSecretPassword99"
      responses:
        200:
          description: Security password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Security password updated successfully."
        400:
          description: Missing required fields / New password too short
        401:
          description: Current password statement is incorrect
        404:
          description: User session not found

  # ðŸ“¤ â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ Profile ROUTES â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /auth/profile:
    get:
      summary: Fetch user profile dashboard with completion progress
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profile dashboard details returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  profileProgress:
                    type: string
                    example: "60%"
                  user:
                    type: object
        404:
          description: Profile not found

  /auth/profile-update:
    patch:
      summary: Update profile details and calculate live completion progress
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: Aditto
                lastName:
                  type: string
                  example: Dev
                phone:
                  type: string
                  example: "01712345678"
                bio:
                  type: string
                  example: "Senior Frontend Web Developer specializing in UI UX"
                avatar:
                  type: string
                  example: "https://example.com/uploads/avatar.jpg"
                coverPhoto:
                  type: string
                  example: "https://example.com/uploads/cover.jpg"
                linkedinUrl:
                  type: string
                  example: "https://linkedin.com/in/adittodev"
                githubUrl:
                  type: string
                  example: "https://github.com/adittodev"
                skills:
                  type: array
                  items:
                    type: string
                  example: ["React", "Next.js", "TypeScript", "Tailwind CSS"]
      responses:
        200:
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profile dashboard updated successfully."
                  profileProgress:
                    type: string
                    example: "80%"
                  user:
                    type: object
        404:
          description: User account not found

  /auth/request-badge:
    post:
      summary: Apply for a milestone profile tier badge (bronze, silver, blue)
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetBadge
              properties:
                targetBadge:
                  type: string
                  enum: [bronze, silver, blue]
                  example: silver
      responses:
        200:
          description: Badge request queued for admin review
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Your application for SILVER tier badge has been queued for admin verification."
        400:
          description: Invalid badge type / Insufficient profile completion percentage
        404:
          description: User details not found

  /auth/change-password:
    patch:
      summary: Change account password while logged in
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: "password123"
                newPassword:
                  type: string
                  example: "myNewSecretPassword99"
      responses:
        200:
          description: Security password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Security password updated successfully."
        400:
          description: Missing required fields / New password too short
        401:
          description: Current password statement is incorrect
        404:
          description: User session not found

  # ðŸ“¤ â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ UPLOAD ROUTES â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /upload/image:
    post:
      summary: Upload an image file (e.g. avatar, thumbnail) to Cloudinary
      tags:
        - Upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file to upload (max 5MB)
      responses:
        200:
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Image uploaded successfully"
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: "https://res.cloudinary.com/demo/image/upload/v1234567890/edunext_images/xyz.png"
                      publicId:
                        type: string
                        example: "edunext_images/xyz"
                      format:
                        type: string
                        example: "png"
        400:
          description: No image file provided or file type not supported
        500:
          description: Image upload failed

  # ðŸ‘‘ â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ SUPER ADMIN ROUTES â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /admin/user-stats:
    get:
      summary: Get user management stats cards data (Admin Only)
      tags:
        - Super Admin Actions
      responses:
        200:
          description: Stats fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User management stats fetched successfully"
                  data:
                    type: object
                    properties:
                      totalUsers:
                        type: number
                        example: 7
                      totalStudents:
                        type: number
                        example: 4
                      totalInstructors:
                        type: number
                        example: 3
                      totalSuspended:
                        type: number
                        example: 2
        403:
          description: Forbidden - Admin access required

  /admin/users:
    get:
      summary: Get all registered users with search & pagination (Admin Only)
      tags:
        - Super Admin Actions
      parameters:
        - name: search
          in: query
          required: false
          description: Search by first name, last name, or email (case-insensitive)
          schema:
            type: string
            example: "aditto"
        - name: role
          in: query
          required: false
          description: Filter by user role
          schema:
            type: string
            enum: [student, instructor, admin]
        - name: status
          in: query
          required: false
          description: Filter by account status
          schema:
            type: string
            enum: [active, suspended]
        - name: isVerified
          in: query
          required: false
          description: Filter by email verification status
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: Page number (default 1)
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Number of users per page (max 50, default 10)
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        200:
          description: Users fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Users fetched successfully"
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "65f8a1b2c3d4e5f6a7b8c9d0"
                            firstName:
                              type: string
                              example: "Aditto"
                            lastName:
                              type: string
                              example: "Dev"
                            email:
                              type: string
                              example: "aditto@example.com"
                            role:
                              type: string
                              example: "instructor"
                            isSuspended:
                              type: boolean
                              example: false
                            isVerified:
                              type: boolean
                              example: true
                            createdAt:
                              type: string
                              example: "2025-01-15T10:00:00.000Z"
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                            example: 45
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 10
                          totalPages:
                            type: integer
                            example: 5
        401:
          description: Unauthorized - Invalid or missing token
        403:
          description: Forbidden - Admin access required

  /admin/users/{id}/status:
    patch:
      summary: Suspend or Activate a user account
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The User ID
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, suspended]
                  example: suspended
      responses:
        200:
          description: User status updated successfully

  /admin/instructors/{id}/verify:
    patch:
      summary: Verify or Reject an instructor profile
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The Instructor/User ID
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  example: approved
      responses:
        200:
          description: Instructor verification updated successfully

  /admin/users/{id}:
    delete:
      summary: Permanently delete a user account
      tags:
        - Super Admin Actions
      parameters:
        - name: id
          in: path
          required: true
          description: The User ID to delete
          schema:
            type: string
            example: "65f8a1b2c3d4e5f6a7b8c9d0"
      responses:
        200:
          description: User deleted successfully

